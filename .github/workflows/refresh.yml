name: Refresh Match Data

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
  push:
    branches: [master]
    paths-ignore:            # don't re-trigger on the data commits the workflow itself makes
      - 'docs/data/**'
      - 'data/organizer-geocache.json'
      - 'data/reverse-geocache.json'
  workflow_dispatch:         # allow manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false  # let a running fetch finish; new run queues behind it

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare SSI refresh token
        env:
          SSI_REFRESH_TOKEN: ${{ secrets.SSI_REFRESH_TOKEN }}
          SSI_EMAIL: ${{ secrets.SSI_EMAIL }}
          SSI_PASSWORD: ${{ secrets.SSI_PASSWORD }}
          GH_TOKEN: ${{ secrets.SSI_REPO_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "prepare: SSI_REFRESH_TOKEN present=$([ -n \"$SSI_REFRESH_TOKEN\" ] && echo yes || echo no)"
          echo "prepare: SSI_REPO_ADMIN_TOKEN present=$([ -n \"$GH_TOKEN\" ] && echo yes || echo no)"

          if [ -z "$SSI_REFRESH_TOKEN" ]; then
            echo "SSI_REFRESH_TOKEN is missing; fetch step will fail until the secret is set."
            exit 0
          fi

          echo "::add-mask::$SSI_REFRESH_TOKEN"
          echo "SSI_REFRESH_TOKEN=$SSI_REFRESH_TOKEN" >> "$GITHUB_ENV"

          if [ -z "$GH_TOKEN" ]; then
            echo "SSI_REPO_ADMIN_TOKEN not set; using current SSI refresh token without rotation."
            exit 0
          fi

          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not found on runner; using current SSI refresh token without rotation."
            exit 0
          fi

          ROTATE_LOG=$(mktemp)
          # The Actions shell uses "set -e"; temporarily disable it so we can
          # inspect the node exit code and decide how to proceed.
          set +e
          NEW_RT=$(node - <<'NODE' 2>"$ROTATE_LOG"
          (async () => {
            const endpoint = 'https://shootnscoreit.com/graphql/';
            const rt = process.env.SSI_REFRESH_TOKEN;
            if (!rt) {
              console.error('rotation: SSI_REFRESH_TOKEN input is empty');
              process.exit(3);
            }

            const query = `
              mutation Rotate($rt: String!) {
                refresh_token(refresh_token: $rt, revoke_refresh_token: true) {
                  success
                  errors
                  refresh_token { token }
                }
              }
            `;

            const res = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
              },
              body: JSON.stringify({ query, variables: { rt } }),
            });

            if (!res.ok) {
              console.error(`rotation: HTTP ${res.status} ${res.statusText}`);
              process.exit(4);
            }
            const data = await res.json();
            if (data?.errors?.length) {
              const msgs = data.errors.map(e => e?.message).filter(Boolean).join(' | ');
              console.error(`rotation: GraphQL errors: ${msgs || 'unknown'}`);
              process.exit(4);
            }

            const payload = data?.data?.refresh_token;
            if (!payload?.success) {
              const rawErrs = payload?.errors;
              let errs = '';
              if (Array.isArray(rawErrs)) {
                errs = rawErrs.map(e => {
                  if (typeof e === 'string') return e;
                  if (e && typeof e === 'object' && e.message) return e.message;
                  return JSON.stringify(e);
                }).join(' | ');
              } else if (rawErrs && typeof rawErrs === 'object') {
                if (Array.isArray(rawErrs.nonFieldErrors)) {
                  errs = rawErrs.nonFieldErrors.map(e => {
                    if (typeof e === 'string') return e;
                    if (e && typeof e === 'object' && e.message) return e.message;
                    return JSON.stringify(e);
                  }).join(' | ');
                } else {
                  errs = JSON.stringify(rawErrs);
                }
              } else if (typeof rawErrs === 'string') {
                errs = rawErrs;
              }
              console.error(`rotation: mutation unsuccessful: ${errs || 'unknown'}`);
              process.exit(4);
            }

            const next = payload?.refresh_token?.token;
            if (!next) {
              const expiresAt = payload?.refresh_token?.expires_at || 'unknown';
              const isExpired = payload?.refresh_token?.is_expired;
              console.error(`rotation: no replacement refresh token returned (is_expired=${isExpired}, expires_at=${expiresAt})`);
              process.exit(5);
            }

            process.stdout.write(next);
          })().catch((err) => {
            console.error(`rotation: unexpected exception while rotating refresh token: ${err?.message || err}`);
            process.exit(6);
          });
          NODE
          )
          ROTATE_RC=$?
          set -e
          cat "$ROTATE_LOG"
          rm -f "$ROTATE_LOG"

          if [ -n "$NEW_RT" ]; then
            echo "::add-mask::$NEW_RT"
            # Use the rotated token immediately for this workflow run, even if
            # writing back to repo secrets fails.
            echo "SSI_REFRESH_TOKEN=$NEW_RT" >> "$GITHUB_ENV"
            if gh secret set SSI_REFRESH_TOKEN --repo "$REPO" --body "$NEW_RT"; then
              echo "SSI refresh token rotated and stored in Actions secret."
              echo "prepare: effective token source=rotated+persisted"
            else
              echo "Token rotation returned a new token, but saving to GitHub Secrets failed."
              echo "Current run will continue with the rotated token, but next runs may fail until secret write is fixed."
              echo "prepare: effective token source=rotated-not-persisted"
            fi
          else
            if [ "$ROTATE_RC" -eq 5 ]; then
              echo "Refresh call succeeded but SSI did not issue a replacement refresh token."
              echo "Using existing SSI_REFRESH_TOKEN for this run."
              echo "prepare: effective token source=existing"
            elif [ "$ROTATE_RC" -eq 4 ]; then
              echo "Refresh call failed (likely invalid/expired SSI_REFRESH_TOKEN)."
              if [ -n "$SSI_EMAIL" ] && [ -n "$SSI_PASSWORD" ]; then
                echo "Attempting credential fallback to mint a new refresh token..."
                FALLBACK_LOG=$(mktemp)
                set +e
                FALLBACK_RT=$(node -e '(async () => {
                  const endpoint = "https://shootnscoreit.com/graphql/";
                  const email = process.env.SSI_EMAIL;
                  const password = process.env.SSI_PASSWORD;
                  if (!email || !password) {
                    console.error("fallback: SSI_EMAIL/SSI_PASSWORD not provided");
                    process.exit(7);
                  }

                  const query = "mutation TokenAuth($email: String!, $password: String!) { token_auth(email: $email, password: $password) { success errors refresh_token { token } } }";

                  const res = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                    },
                    body: JSON.stringify({ query, variables: { email, password } }),
                  });

                  if (!res.ok) {
                    console.error(`fallback: HTTP ${res.status} ${res.statusText}`);
                    process.exit(8);
                  }
                  const data = await res.json();
                  if (data?.errors?.length) {
                    const msgs = data.errors.map(e => e?.message).filter(Boolean).join(" | ");
                    console.error(`fallback: GraphQL errors: ${msgs || "unknown"}`);
                    process.exit(8);
                  }

                  const payload = data?.data?.token_auth;
                  if (!payload?.success) {
                    const rawErrs = payload?.errors;
                    let errs = "";
                    if (Array.isArray(rawErrs)) {
                      errs = rawErrs.map(e => {
                        if (typeof e === "string") return e;
                        if (e && typeof e === "object" && e.message) return e.message;
                        return JSON.stringify(e);
                      }).join(" | ");
                    } else if (rawErrs && typeof rawErrs === "object") {
                      errs = JSON.stringify(rawErrs);
                    } else if (typeof rawErrs === "string") {
                      errs = rawErrs;
                    }
                    console.error(`fallback: token_auth unsuccessful: ${errs || "unknown"}`);
                    process.exit(8);
                  }

                  const next = payload?.refresh_token?.token;
                  if (!next) {
                    console.error("fallback: token_auth returned no refresh token");
                    process.exit(8);
                  }

                  process.stdout.write(next);
                })().catch((err) => {
                  console.error(`fallback: unexpected exception: ${err?.message || err}`);
                  process.exit(9);
                });' 2>"$FALLBACK_LOG")
                FALLBACK_RC=$?
                set -e
                cat "$FALLBACK_LOG"
                rm -f "$FALLBACK_LOG"

                if [ -n "$FALLBACK_RT" ]; then
                  echo "::add-mask::$FALLBACK_RT"
                  echo "SSI_REFRESH_TOKEN=$FALLBACK_RT" >> "$GITHUB_ENV"
                  if gh secret set SSI_REFRESH_TOKEN --repo "$REPO" --body "$FALLBACK_RT"; then
                    echo "Credential fallback succeeded and SSI_REFRESH_TOKEN secret was updated."
                    echo "prepare: effective token source=fallback+persisted"
                  else
                    echo "Credential fallback got a new token, but secret write failed."
                    echo "Current run will continue with the fallback token; next runs may fail until secret write is fixed."
                    echo "prepare: effective token source=fallback-not-persisted"
                  fi
                else
                  echo "Credential fallback failed (rc=$FALLBACK_RC)."
                  echo "Please generate a new refresh token with scripts/get_refresh_token.py and update Actions secret SSI_REFRESH_TOKEN."
                  exit 1
                fi
              else
                echo "No SSI_EMAIL/SSI_PASSWORD secrets set for automatic recovery."
                echo "Please generate a new refresh token with scripts/get_refresh_token.py and update Actions secret SSI_REFRESH_TOKEN."
                exit 1
              fi
            elif [ "$ROTATE_RC" -ne 0 ]; then
              echo "Refresh token rotation failed unexpectedly (rc=$ROTATE_RC)."
              echo "Using existing SSI_REFRESH_TOKEN for this run."
              echo "prepare: effective token source=existing"
            else
              echo "Refresh token rotation returned no token output; using existing token for this run."
              echo "prepare: effective token source=existing"
            fi
          fi

      - name: Fetch match data
        env:
          SSI_API_KEY:       ${{ secrets.SSI_API_KEY }}
          SSI_COUNTRIES:     ${{ vars.SSI_COUNTRIES }}
        run: node scripts/fetch-matches.js

      - name: Bust asset cache
        run: |
          HASH=$(git rev-parse --short HEAD)
          sed -i "s|app\.js[^\"]*|app.js?v=${HASH}|" docs/index.html
          sed -i "s|style\.css[^\"]*|style.css?v=${HASH}|" docs/index.html

      - name: Notify Discord
        env:
          DISCORD_NOTIFY_CONFIG: ${{ secrets.DISCORD_NOTIFY_CONFIG != '' && secrets.DISCORD_NOTIFY_CONFIG || vars.DISCORD_NOTIFY_CONFIG }}
          DISCORD_NOTIFY_WEBHOOKS: ${{ secrets.DISCORD_NOTIFY_WEBHOOKS != '' && secrets.DISCORD_NOTIFY_WEBHOOKS || vars.DISCORD_NOTIFY_WEBHOOKS }}
          DISCORD_HOKK_RIFLE_MATCH: ${{ secrets.DISCORD_HOKK_RIFLE_MATCH }}
          DISCORD_HOKK_HANDGUN_MATCH: ${{ secrets.DISCORD_HOKK_HANDGUN_MATCH }}
          DISCORD_HOKK_PCC_MATCH: ${{ secrets.DISCORD_HOKK_PCC_MATCH }}
          DISCORD_HOKK_SHOTGUN_MATCH: ${{ secrets.DISCORD_HOKK_SHOTGUN_MATCH }}
          DISCORD_WEBHOOK_SWEDEN: ${{ secrets.DISCORD_WEBHOOK_SWEDEN }}
          DISCORD_WEBHOOK_NORWAY_RIFLE: ${{ secrets.DISCORD_WEBHOOK_NORWAY_RIFLE }}
          DISCORD_WEBHOOK_NORWAY_HANDGUN_PCC: ${{ secrets.DISCORD_WEBHOOK_NORWAY_HANDGUN_PCC }}
          DISCORD_WEBHOOK_NORWAY_PCC: ${{ secrets.DISCORD_WEBHOOK_NORWAY_PCC }}
        run: |
          if [ -n "$DISCORD_NOTIFY_CONFIG" ]; then
            echo "$DISCORD_NOTIFY_CONFIG" > data/discord-notify-config.json
          fi
          node scripts/discord-notify.js

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/matches.json docs/index.html data/organizer-geocache.json data/reverse-geocache.json data/discord-notify-state.json data/discord-notify-config.json
          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh match data [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            # Rebase onto any commits that landed while we were fetching.
            # If there's a conflict (two runs overlapping), resolve by keeping
            # our freshly-generated files and re-stamping the asset cache SHA.
            if ! git pull --rebase origin master; then
              git diff --name-only --diff-filter=U | xargs git checkout --theirs --
              HASH=$(git rev-parse --short HEAD)
              sed -i "s|app\.js[^\"]*|app.js?v=${HASH}|" docs/index.html
              sed -i "s|style\.css[^\"]*|style.css?v=${HASH}|" docs/index.html
              git add -f docs/data/matches.json docs/index.html data/organizer-geocache.json data/reverse-geocache.json
              git rebase --continue
            fi
            git push
          fi
